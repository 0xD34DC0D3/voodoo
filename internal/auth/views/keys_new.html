{{template "top" .}}
<h1>Key created: {{.Name}}</h1>

<div class="secret">
  <p class="warn">Copy this key now. It won't be shown again.</p>
  <pre><code id="key-value">{{.Raw}}</code></pre>
  <p><button type="button" class="ghost" id="copy-key" hidden>Copy</button></p>
  <p class="hint">Click the key to select it. Send it as <code>Authorization: Bearer &lt;key&gt;</code>.</p>
</div>

<p class="backlink"><a href="/keys">← back</a> <span class="path">/keys</span></p>

<script src="/static/copy-key.js" defer></script>
{{template "bottom" .}}

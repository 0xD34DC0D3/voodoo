name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to GitHub; each job repeats this so a new job does not
# inherit more by accident.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Install tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@$(make -s print-SQLC_VERSION)
          go install golang.org/x/vuln/cmd/govulncheck@$(make -s print-GOVULNCHECK_VERSION)

      - name: sqlc generate is up to date
        run: |
          make sqlc
          if [ -n "$(git status --porcelain -- internal/auth/store)" ]; then
            git status --short -- internal/auth/store
            git diff -- internal/auth/store
            echo "generated code is stale; run 'make sqlc' and commit"; exit 1
          fi

      - name: govulncheck
        run: ./deploy/vulncheck.sh

  deploy:
    needs: test
    # Dormant until DEPLOY_ENABLED is true (docs/deploy.md). The host itself
    # is a secret: a job-level if cannot read secrets, and a variable would be
    # printed in the step's env block of a public log.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release
        run: |
          mkdir stage
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o stage/voodoo ./cmd/voodoo
          cp deploy/backup.sh deploy/voodoo.service stage/

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Secrets are masked whole; ssh errors print the bare host, and a
          # multi-line secret is not reliably masked line by line.
          echo "::add-mask::$HOST"
          echo "::add-mask::${HOST#*@}"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            line="${line#"${line%%[![:space:]]*}"}"
            # Skip blanks and comments: masking "#" would hide every # in the log.
            case "$line" in ''|'#'*) continue ;; esac
            echo "::add-mask::$line"
            # A marker (@cert-authority, @revoked) comes before the host field.
            case "$line" in '@'*) line="${line#* }" ;; esac
            # The host field: "name,ip" or "[name]:port", unless hashed.
            IFS=, read -ra names <<< "${line%% *}"
            for n in "${names[@]}"; do
              n="${n#!}"; n="${n#[}"; n="${n%%]*}"
              [ -z "$n" ] || echo "::add-mask::$n"
            done
          done <<< "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C stage voodoo backup.sh voodoo.service |
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HOST"
